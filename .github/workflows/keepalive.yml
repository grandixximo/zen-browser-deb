name: Keep scheduled workflows active

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 4'

permissions:
  contents: write

concurrency:
  group: zen-browser-deb-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Commit only after 45 inactive days
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          printf 'Last commit age: %s days\n' "$age_days"
          if (( age_days < 45 )); then
              printf '%s\n' 'Repository is active; no keepalive commit needed.'
              exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep scheduled workflows active'
          git push
